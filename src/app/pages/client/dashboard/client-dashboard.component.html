<div class="row">
    <div class="col-md-4" *ngFor="let kpi of kpis">
        <nb-card>
            <nb-card-header>{{ kpi.title }}</nb-card-header>
            <nb-card-body style="text-align: center;">
                <h2>{{ kpi.value }}</h2>
                <small *ngIf="kpi.subtitle">{{ kpi.subtitle }}</small>
            </nb-card-body>
        </nb-card>
    </div>
</div>

<div class="row">
    <div class="col-md-4" *ngFor="let stat of stats">
        <nb-card>
            <nb-card-body style="display: flex; align-items: center; gap: 16px;">
                <nb-icon [icon]="stat.icon" style="font-size: 2.5rem; color: #ffbb0f;"></nb-icon>
                <div>
                    <h3 style="margin: 0;">{{ stat.value }}</h3>
                    <small>{{ stat.title }}</small>
                </div>
            </nb-card-body>
        </nb-card>
    </div>
</div>

<nb-card>
    <nb-card-header>{{ 'common.topLastProducts' | translate }}</nb-card-header>
    <nb-card-body>
        <p>{{ 'common.inDevelopment' | translate }}</p>
    </nb-card-body>
</nb-card>
