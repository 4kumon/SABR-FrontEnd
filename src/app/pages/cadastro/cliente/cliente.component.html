<nb-card>
    <nb-card-header>
        <ngx-crud-toolbar
            title="Clientes"
            createButtonText="Novo"
            createButtonStatus="warning"
            (create)="onCreate()"
        ></ngx-crud-toolbar>
    </nb-card-header>

    <nb-card-body>
        <ng2-smart-table class="app-smart-table" [settings]="settings" [source]="source" (edit)="onEdit($event)" (delete)="onDelete($event)">
        </ng2-smart-table>
    </nb-card-body>
</nb-card>
