<nb-card>
    <nb-card-header class="card-header-actions">
        <span>Clientes</span>

        <button nbButton size="small" status="success" (click)="onCreate()">
            <nb-icon icon="plus-outline"></nb-icon>
            Novo
        </button>
    </nb-card-header>

    <nb-card-body>
        <ng2-smart-table class="app-smart-table" [settings]="settings" [source]="source" (edit)="onEdit($event)" (delete)="onDelete($event)">
        </ng2-smart-table>
    </nb-card-body>
</nb-card>
