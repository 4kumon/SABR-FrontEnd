<nb-card>
  <nb-card-header>
    {{ isEditMode ? 'Editar Canal' : 'Novo Canal' }}
    <button nbButton ghost status="danger" size="medium" (click)="cancel()" style="float: right; margin-top: -5px;" type="button" tabindex="-1">
      <nb-icon icon="close-outline"></nb-icon>
    </button>
  </nb-card-header>
  <nb-card-body>
    <form [formGroup]="form">
      <div class="form-group">
        <label for="nome">Nome <span class="required">*</span></label>
        <input nbInput fullWidth id="nome" formControlName="nome" placeholder="Digite o nome do canal" [ngClass]="{'input-error': form.get('nome')?.invalid && form.get('nome')?.touched}">
        <div *ngIf="form.get('nome')?.invalid && form.get('nome')?.touched" class="error-text">
          Nome é obrigatório (mínimo 3 caracteres)
        </div>
      </div>

      <div class="form-group">
        <label for="tipo">Tipo <span class="required">*</span></label>
        <input nbInput fullWidth id="tipo" formControlName="tipo" placeholder="Digite o tipo do canal" [ngClass]="{'input-error': form.get('tipo')?.invalid && form.get('tipo')?.touched}">
        <div *ngIf="form.get('tipo')?.invalid && form.get('tipo')?.touched" class="error-text">
          Tipo é obrigatório
        </div>
      </div>

      <div class="form-group">
        <label for="status">Status <span class="required">*</span></label>
        <input nbInput fullWidth id="status" formControlName="status" placeholder="Digite o status" [ngClass]="{'input-error': form.get('status')?.invalid && form.get('status')?.touched}">
        <div *ngIf="form.get('status')?.invalid && form.get('status')?.touched" class="error-text">
          Status é obrigatório
        </div>
      </div>
    </form>
  </nb-card-body>
  <nb-card-footer style="display: flex; justify-content: center;">
    <button nbButton status="success" (click)="save()">{{ isEditMode ? 'Salvar' : 'Criar' }}</button>
  </nb-card-footer>
</nb-card>
