<nb-card>
  <nb-card-header>
    <div class="row">
      <div class="col-md-6">
        <h3>Canais</h3>
      </div>
      <div class="col-md-6 text-right">
        <button nbButton status="primary" (click)="onAddNew()" style="margin-right: 8px;">
          <nb-icon icon="plus-outline"></nb-icon>
          Novo Canal
        </button>
        <button nbButton status="warning" (click)="onDeleteSelected()" style="margin-right: 8px;">
          <nb-icon icon="trash-2-outline"></nb-icon>
          Excluir Selecionados
        </button>
        <button nbButton status="success" (click)="exportToCSV()">
          <nb-icon icon="download-outline"></nb-icon>
          Exportar CSV
        </button>
      </div>
    </div>
  </nb-card-header>
  <nb-card-body>
    <ag-grid-angular
      class="ag-theme-alpine"
      style="width: 100%; height: 500px"
      [columnDefs]="columnDefs"
      [rowData]="rowData"
      [defaultColDef]="defaultColDef"
      [pagination]="true"
      [paginationPageSize]="10"
      [rowSelection]="'multiple'"
      [animateRows]="true"
      (gridReady)="onGridReady($event)"
      (cellValueChanged)="onCellValueChanged($event)">
    </ag-grid-angular>
  </nb-card-body>
</nb-card>
