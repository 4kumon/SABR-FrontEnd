<div class="pedidos-filter">
    <nb-select placeholder="Filtrar por status" [selected]="statusFilter" (selectedChange)="onFilterChange($event)">
        <nb-option value="todos">Todos</nb-option>
        <nb-option value="pago">Pagos</nb-option>
        <nb-option value="cancelado">Cancelados</nb-option>
        <nb-option value="pendente">Pendentes</nb-option>
    </nb-select>
</div>

<app-ag-grid-table
    [columnDefs]="columnDefs"
    [rowData]="rowData"
    [title]="'Pedidos'"
    [pagination]="true"
    [paginationPageSize]="10"
    [localeText]="localeText"
    [formFields]="formFields"
    (onAdd)="onAddNew($event)"
    (onEdit)="onEditRow($event)"
    (onDeleteSelected)="onDeleteSelected($event)">
</app-ag-grid-table>
