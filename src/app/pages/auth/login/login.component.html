<!-- Logo -->
<div class="login-logo">
  <img src="assets/images/logos/logo-seuarmazemdrop-horizontal.png"
       alt="Logo"
       onerror="this.style.display='none'">
</div>

<!-- Título -->
<p class="sub-title" style="margin: 20px;">Faça login para continuar</p>

<!-- Mensagens de erro -->
<nb-alert *ngIf="showMessages.error && errors?.length > 0" outline="danger" role="alert">
  <p class="alert-title"><b>Erro!</b></p>
  <ul class="alert-message-list">
    <li *ngFor="let error of errors" class="alert-message">{{ error }}</li>
  </ul>
</nb-alert>

<!-- Mensagens de sucesso -->
<nb-alert *ngIf="showMessages.success && messages?.length > 0" outline="success" role="alert">
  <p class="alert-title"><b>Sucesso!</b></p>
  <ul class="alert-message-list">
    <li *ngFor="let message of messages" class="alert-message">{{ message }}</li>
  </ul>
</nb-alert>

<!-- Formulário -->
<form (ngSubmit)="login()" #form="ngForm" aria-labelledby="title">

  <div class="form-control-group">
    <label class="label" for="input-email">E-mail:</label>
    <input nbInput fullWidth
           id="input-email"
           name="email"
           type="email"
           pattern=".+@.+\..+"
           placeholder="E-mail"
           fieldSize="large"
           autofocus
           [(ngModel)]="user.email"
           #email="ngModel"
           [required]="true"
           [attr.aria-invalid]="email.invalid && email.touched ? true : null"
           [status]="email.dirty ? (email.invalid ? 'danger' : 'success') : 'basic'"
           autocomplete="email">
    <ng-container *ngIf="email.invalid && email.touched">
      <p class="caption status-danger" *ngIf="email.errors?.required">E-mail é obrigatório.</p>
      <p class="caption status-danger" *ngIf="email.errors?.pattern">E-mail inválido.</p>
    </ng-container>
  </div>

  <div class="form-control-group">
    <span class="label-with-link">
      <label class="label" for="input-password">Senha:</label>
      <a class="forgot-password caption-2" routerLink="/auth/request-password">Esqueceu sua senha?</a>
    </span>
    <input nbInput fullWidth
           id="input-password"
           name="password"
           [type]="showPassword ? 'text' : 'password'"
           placeholder="Senha"
           fieldSize="large"
           [(ngModel)]="user.password"
           #password="ngModel"
           [required]="true"
           [minlength]="4"
           [attr.aria-invalid]="password.invalid && password.touched ? true : null"
           [status]="password.dirty ? (password.invalid ? 'danger' : 'success') : 'basic'"
           autocomplete="current-password">
    <ng-container *ngIf="password.invalid && password.touched">
      <p class="caption status-danger" *ngIf="password.errors?.required">Senha é obrigatória.</p>
      <p class="caption status-danger" *ngIf="password.errors?.minlength">Senha deve ter no mínimo 4 caracteres.</p>
    </ng-container>
  </div>

  <!-- Botão Entrar -->
  <button nbButton fullWidth
          status="warning"
          size="large"
          type="submit"
          [nbSpinner]="submitted"
          nbSpinnerStatus="control"
          [disabled]="submitted"
          [class.btn-pulse]="submitted">
    Entrar
  </button>

</form>
