<!-- Logo -->
<div class="login-logo">
  <img src="assets/images/logos/logo-seuarmazemdrop-horizontal.png"
       alt="Logo"
       onerror="this.style.display='none'">
</div>

<p class="sub-title" style ="margin: 20px;" >Informe seu e-mail para receber instruções de recuperação</p>

<!-- Mensagens de erro -->
<nb-alert *ngIf="showMessages.error && errors?.length > 0" outline="danger" role="alert">
  <p class="alert-title"><b>Erro!</b></p>
  <ul class="alert-message-list">
    <li *ngFor="let error of errors" class="alert-message">{{ error }}</li>
  </ul>
</nb-alert>

<!-- Mensagens de sucesso -->
<nb-alert *ngIf="showMessages.success && messages?.length > 0" outline="success" role="alert">
  <p class="alert-title"><b>Sucesso!</b></p>
  <ul class="alert-message-list">
    <li *ngFor="let message of messages" class="alert-message">{{ message }}</li>
  </ul>
</nb-alert>

<!-- Formulário -->
<form (ngSubmit)="requestPass()" #requestPassForm="ngForm" aria-labelledby="title">

  <div class="form-control-group">
    <label class="label" for="input-email">E-mail:</label>
    <input nbInput fullWidth
           id="input-email"
           name="email"
           type="email"
           pattern=".+@.+\..+"
           placeholder="E-mail"
           fieldSize="large"
           autofocus
           [(ngModel)]="user.email"
           #email="ngModel"
           [required]="true"
           [attr.aria-invalid]="email.invalid && email.touched ? true : null"
           [status]="email.dirty ? (email.invalid ? 'danger' : 'success') : 'basic'"
           autocomplete="email">
    <ng-container *ngIf="email.invalid && email.touched">
      <p class="caption status-danger" *ngIf="email.errors?.required">E-mail é obrigatório.</p>
      <p class="caption status-danger" *ngIf="email.errors?.pattern">E-mail inválido.</p>
    </ng-container>
  </div>

  <!-- Botão Recuperar -->
  <button nbButton fullWidth
          status="warning"
          size="large"
          type="submit"
          [nbSpinner]="submitted"
          nbSpinnerStatus="control"
          [disabled]="submitted || !requestPassForm.valid"
          [class.btn-pulse]="submitted">
    Recuperar Senha
  </button>

</form>

<!-- Voltar ao login -->
<section class="sign-in-section" aria-label="Voltar ao login">
  <p><a class="text-link" routerLink="/auth/login">Voltar ao login</a></p>
</section>
